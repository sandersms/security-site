name: Fetch CISA Weekly Vulnerability Summary

on:
  schedule:
    # Runs every Monday at 14:00 UTC (10:00 AM EST)
    - cron: '0 14 * * 1'
  workflow_dispatch: # Allows manual triggers from the GitHub Actions UI

jobs:
  fetch-cisa-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Fetch Latest CISA Bulletin Webpage
        run: |
          mkdir -p cisa_reports
          
          # Fetch the main bulletins index page
          INDEX_URL="https://www.cisa.gov/news-events/bulletins"
          echo "Fetching bulletins index from $INDEX_URL..."
          
          # Find the href matching the latest weekly bulletin pattern (/news-events/bulletins/sb...)
          BULLETIN_PATH=$(curl -sL "$INDEX_URL" | grep -oE '/news-events/bulletins/sb[0-9]{2}-[0-9]{3}' | head -n 1)
          
          if [ -z "$BULLETIN_PATH" ]; then
            echo "Error: Could not extract bulletin URL."
            exit 1
          fi
          
          FULL_URL="https://www.cisa.gov${BULLETIN_PATH}"
          FILENAME="cisa_summary_$(date +'%Y-%m-%d').html"
          
          echo "Latest Bulletin URL: $FULL_URL"
          echo "Saving page to cisa_reports/$FILENAME..."
          
          # Download the target weekly summary webpage
          curl -sL "$FULL_URL" -o "cisa_reports/$FILENAME"

      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cisa-weekly-summary-${{ github.run_id }}
          path: cisa_reports/*.html
          retention-days: 30

      # Optional: Commit the downloaded file back to the repository
      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cisa_reports/
          git commit -m "chore: add CISA weekly vulnerability summary for $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push