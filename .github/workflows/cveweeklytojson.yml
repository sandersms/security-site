name: Fetch and Parse CISA Weekly Vulnerabilities

on:
  schedule:
    # Runs every Monday at 14:00 UTC (10:00 AM EST)
    - cron: '0 14 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  parse-cisa-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Fetch and Parse Bulletin
        run: |
          python - << 'EOF'
          import re
          import json
          import datetime
          import requests
          from bs4 import BeautifulSoup

          # Browser headers to bypass basic Cloudflare/Akamai blocks
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.5"
          }

          INDEX_URL = "https://www.cisa.gov/news-events/bulletins"
          bulletin_url = None

          print(f"Fetching index page: {INDEX_URL}")
          try:
              index_resp = requests.get(INDEX_URL, headers=HEADERS, timeout=15)
              index_resp.raise_for_status()

              # Pattern matches sbYY-DDD (e.g., sb26-050)
              match = re.search(r'/(?:news-events/bulletins/)?(sb\d{2}-\d{3})', index_resp.text, re.IGNORECASE)
              if match:
                  bulletin_id = match.group(1).lower()
                  bulletin_url = f"https://www.cisa.gov/news-events/bulletins/{bulletin_id}"
                  print(f"Extracted Bulletin URL from HTML: {bulletin_url}")
          except Exception as e:
              print(f"Scraping failed: {e}")

          # Fallback: Compute most recent Monday bulletin URL (CISA uses Julian day format sbYY-DDD)
          if not bulletin_url:
              print("Falling back to URL calculation for most recent Monday...")
              today = datetime.date.today()
              # Find most recent Monday
              last_monday = today - datetime.timedelta(days=today.weekday())
              year_short = last_monday.strftime("%y")
              day_of_year = last_monday.strftime("%j")
              
              computed_id = f"sb{year_short}-{day_of_year}"
              bulletin_url = f"https://www.cisa.gov/news-events/bulletins/{computed_id}"
              print(f"Computed Fallback URL: {bulletin_url}")

          # Fetch actual bulletin page
          page_resp = requests.get(bulletin_url, headers=HEADERS, timeout=15)
          
          # If calculated URL isn't live yet, fallback to previous week's Monday
          if page_resp.status_code == 404:
              print("Calculated URL returned 404. Attempting prior week's bulletin...")
              prev_monday = last_monday - datetime.timedelta(days=7)
              computed_id = f"sb{prev_monday.strftime('%y')}-{prev_monday.strftime('%j')}"
              bulletin_url = f"https://www.cisa.gov/news-events/bulletins/{computed_id}"
              page_resp = requests.get(bulletin_url, headers=HEADERS, timeout=15)

          page_resp.raise_for_status()
          print(f"Successfully connected to bulletin: {bulletin_url}")

          soup = BeautifulSoup(page_resp.text, 'html.parser')
          page_title = soup.find('h1').text.strip() if soup.find('h1') else "CISA Weekly Vulnerability Summary"
          
          parsed_data = {"title": page_title, "url": bulletin_url, "tables": {}}
          markdown_content = f"# {page_title}\n\n**Source:** [{bulletin_url}]({bulletin_url})\n\n"

          tables = soup.find_all('table')
          for i, table in enumerate(tables):
              prev_h = table.find_previous(['h2', 'h3', 'h4'])
              category = prev_h.text.strip() if prev_h else f"Severity Section {i+1}"
              
              headers = [th.text.strip() for th in table.find_all('th')]
              if not headers:
                  headers = ["Vendor/Product", "Description", "Published", "CVSS Score", "Source Info"]

              rows = []
              for tr in table.find_all('tr'):
                  cells = [td.text.strip() for td in tr.find_all('td')]
                  if cells:
                      row_dict = {headers[j]: cells[j] for j in range(min(len(headers), len(cells)))}
                      rows.append(row_dict)

              parsed_data["tables"][category] = rows

              markdown_content += f"## {category}\n\n"
              if rows:
                  markdown_content += f"| {' | '.join(headers)} |\n"
                  markdown_content += f"| {' | '.join(['---'] * len(headers))} |\n"
                  for row in rows:
                      row_vals = [row.get(h, "").replace("\n", " ") for h in headers]
                      markdown_content += f"| {' | '.join(row_vals)} |\n"
                  markdown_content += "\n"

          date_str = datetime.datetime.now().strftime("%Y-%m-%d")
          import os
          os.makedirs("cisa_reports", exist_ok=True)

          with open(f"cisa_reports/cisa_summary_{date_str}.json", "w", encoding="utf-8") as f:
              json.dump(parsed_data, f, indent=2, ensure_ascii=False)

          with open(f"cisa_reports/cisa_summary_{date_str}.md", "w", encoding="utf-8") as f:
              f.write(markdown_content)

          print("Successfully parsed and written to files.")
          EOF

      - name: Upload Parsed Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cisa-parsed-reports-${{ github.run_id }}
          path: cisa_reports/*

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cisa_reports/
          git commit -m "chore: add parsed CISA summary for $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push